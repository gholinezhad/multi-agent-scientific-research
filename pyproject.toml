[project]
name = "research_assistant"
version = "0.1.0"
description = "Evidence-grounded multi-agent scientific research with LangGraph and Qdrant"
readme = "README.md"
authors = [
    { name = "Sajjad Gholinezhad" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langchain-qdrant[fastembed]>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.16",
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
multi-agent-research = "research_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
